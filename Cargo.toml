[package]
name = "generalbuffer"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "tls-native-tls"] }
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["serde", "v4"] }
