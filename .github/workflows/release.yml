name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-client:
    name: Build Client (${{ matrix.target.os }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: linux
            runner: ubuntu-latest
            src_binary: target/release/client
            asset_name: generalbuffer-client-${{ github.ref_name }}-linux-x86_64
          - os: windows
            runner: windows-latest
            src_binary: target/release/client.exe
            asset_name: generalbuffer-client-${{ github.ref_name }}-windows-x86_64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target.os }}

      - name: Build Client
        run: cargo build --release -p client

      - name: Prepare binary (Linux)
        if: matrix.target.os == 'linux'
        run: cp ${{ matrix.target.src_binary }} ${{ matrix.target.asset_name }}

      - name: Prepare binary (Windows)
        if: matrix.target.os == 'windows'
        shell: pwsh
        run: Copy-Item ${{ matrix.target.src_binary }} -Destination ${{ matrix.target.asset_name }}

      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: ${{ matrix.target.os == 'linux' }}
          files: ${{ matrix.target.asset_name }}

  build-server-docker:
    name: Build & Push Server Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-server
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
