[package]
name = "client"
version = "0.1.0"
edition = "2024"

[dependencies]
confy = "2.0.0"
serde = { version = "1.0.229", features = ["derive"] }
common = { path = "../common" }
ureq = { version = "3.5.1", features = ["json"] }
thiserror = "2.0.21"
serde_json = "1.0.154"
arboard = "3.7.0"
uuid = { version = "1.29.0", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
global-hotkey = "0.9.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }